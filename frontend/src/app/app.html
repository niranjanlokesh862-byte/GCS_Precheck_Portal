<div class="app-layout">
  <header class="app-header">
    <div class="branding">
      <span class="logo">⚡</span>
      <h1>GCS Pre-Check Automation Portal</h1>
      <span class="version-tag">v2.4 Enterprise</span>
    </div>

    <nav class="nav-links">
      <a routerLink="/pm-queue" routerLinkActive="active">PM Routing Queue</a>
    </nav>

    <div class="user-session">
      <span class="user-label">Logged In:</span>
      <select class="user-dropdown" [ngModel]="authService.currentUserId()" (ngModelChange)="onUserChange($event)">
        <option *ngFor="let u of authService.users()" [value]="u.id">
          {{ u.fullName }} ({{ u.role }})
        </option>
      </select>
    </div>
  </header>

  <main class="app-content">
    <router-outlet></router-outlet>
  </main>
</div>
